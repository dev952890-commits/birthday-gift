<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎉</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
background-size:400% 400%;
animation:bg 12s infinite alternate;
}

@keyframes bg{
0%{background-position:left;}
100%{background-position:right;}
}

.container{
width:90%;
max-width:650px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(18px);
padding:40px;
border-radius:25px;
text-align:center;
color:white;
box-shadow:0 15px 35px rgba(0,0,0,.25);
animation:pop .8s ease;
}

@keyframes pop{
0%{transform:scale(.6);opacity:0;}
100%{transform:scale(1);opacity:1;}
}

h1{
font-size:3rem;
margin-bottom:15px;
animation:float 2s infinite ease-in-out;
}

@keyframes float{
50%{
transform:translateY(-8px);
}
}

h2{
font-size:2rem;
margin-bottom:20px;
}

p{
font-size:18px;
line-height:1.8;
margin-bottom:25px;
}

button{
padding:15px 35px;
font-size:18px;
border:none;
border-radius:50px;
background:#ff4081;
color:white;
cursor:pointer;
transition:.3s;
font-weight:bold;
}

button:hover{
background:#ff1f6d;
transform:scale(1.08);
}

.balloon{
position:absolute;
bottom:-150px;
font-size:45px;
animation:fly linear infinite;
}

@keyframes fly{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

.footer{
margin-top:25px;
font-size:15px;
opacity:.9;
}

</style>
</head>
<body>

<div class="container">

<h1>🎂 Happy Birthday! 🎉</h1>

<h2>Dear Friend ❤️</h2>

<p>
May your birthday be filled with endless happiness,
beautiful memories, laughter, love, and success.
May all your dreams come true and may every day
bring you new reasons to smile.
🥳🎈🎁
</p>

<button onclick="celebrate()">
🎉 Celebrate 🎉
</button>

<div class="footer">
Made with ❤️ Just for You
</div>

</div>

<script>

// Confetti
function celebrate(){

confetti({
particleCount:180,
spread:120,
origin:{y:0.6}
});

setTimeout(()=>{
confetti({
particleCount:250,
spread:180,
origin:{y:0.4}
});
},400);

setTimeout(()=>{
confetti({
particleCount:300,
spread:360,
origin:{y:0.2}
});
},800);

}

// Auto Confetti
setTimeout(celebrate,500);

// Balloons
const emojis=["🎈","🎈","🎉","✨","🎊","💖"];

for(let i=0;i<30;i++){

let b=document.createElement("div");

b.className="balloon";

b.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

b.style.left=Math.random()*100+"vw";

b.style.animationDuration=(6+Math.random()*6)+"s";

b.style.fontSize=(30+Math.random()*35)+"px";

b.style.animationDelay=Math.random()*6+"s";

document.body.appendChild(b);

}

</script>

</body>
</html>
